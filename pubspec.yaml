name: anti_pinhole
description: Anti-pinhole thermal detection POC.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.35.5
  flutter_map: ^7.0.2
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  latlong2: ^0.9.1
  sqflite: ^2.3.3+1
  flutter_map_cache: ^2.1.0
  http_cache_sembast_store: ^1.0.1
  sembast: ^3.8.7
  sembast_web: ^2.4.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/scenario_safe.json
    - assets/scenario_danger.json
    - assets/scenario_warning.json